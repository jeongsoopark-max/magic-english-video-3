<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>수능 유형별 공략실 · MAGIC ENGLISH</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  :root{--bg:#f4f6fb;--surface:#fff;--ink:#1f2438;--muted:#6b7185;--line:#e6e9f2;--soft:#f4f5fa;
    --accent:#4f46e5;--accent-soft:#eef0fe;--warn:#d97706;--warn-soft:#fef3c7;--ok:#059669;--ok-soft:#e7f6ef;--no:#e11d48;--no-soft:#fdecec;
    --shadow:0 16px 40px -24px rgba(31,36,56,.35);--radius:20px;
    font-family:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink)}
  body{min-height:100vh;display:flex;justify-content:center;padding:22px 14px 44px;-webkit-font-smoothing:antialiased}
  .app{width:100%;max-width:640px}
  .kicker{font-size:11px;letter-spacing:.18em;font-weight:700;color:var(--accent);text-transform:uppercase}
  .name{font-size:22px;font-weight:800;letter-spacing:-.01em}
  .lead{font-size:13px;color:var(--muted);line-height:1.55;margin:6px 0 18px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:22px}
  @media(min-width:520px){.grid{grid-template-columns:repeat(3,1fr)}}
  .chip{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 10px;cursor:pointer;text-align:left;transition:.15s;font-family:inherit}
  .chip:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
  .chip .em{font-size:18px}
  .chip .t{font-size:13.5px;font-weight:700;color:var(--ink);margin-top:6px;line-height:1.25}
  .chip[aria-selected="true"]{background:var(--accent);border-color:transparent;box-shadow:var(--shadow)}
  .chip[aria-selected="true"] .t{color:#fff}
  .chip:focus-visible{outline:3px solid var(--accent-soft);outline-offset:2px}
  .detail{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px 22px}
  .dhead{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .dhead .big{font-size:26px}
  .dhead h2{font-size:20px;font-weight:800;letter-spacing:-.01em}
  .oneline{font-size:13.5px;color:var(--muted);line-height:1.55;margin-bottom:18px}
  .sec{margin-top:18px}
  .sec .lab{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;letter-spacing:.02em;padding:4px 11px;border-radius:99px;margin-bottom:12px}
  .lab.steps{color:var(--accent);background:var(--accent-soft)}
  .lab.traps{color:var(--warn);background:var(--warn-soft)}
  .lab.tip{color:var(--ok);background:var(--ok-soft)}
  .lab.ex{color:#7c3aed;background:#f0e9fe}
  ol.steps{list-style:none;counter-reset:s}
  ol.steps li{counter-increment:s;position:relative;padding:0 0 14px 40px;font-size:14px;line-height:1.6}
  ol.steps li:before{content:counter(s);position:absolute;left:0;top:-2px;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center}
  ol.steps li:not(:last-child):after{content:"";position:absolute;left:13px;top:26px;bottom:2px;width:2px;background:var(--accent-soft)}
  ul.traps{list-style:none}
  ul.traps li{position:relative;padding:0 0 9px 22px;font-size:13.5px;line-height:1.55;color:#4a5068}
  ul.traps li:before{content:"⚠";position:absolute;left:0;top:0;color:var(--warn);font-size:13px}
  .tipbox{background:var(--ok-soft);border-radius:12px;padding:13px 15px;font-size:13.5px;line-height:1.6;color:#085a3c}
  .tipbox b{font-weight:800}
  b.hl{font-weight:700;background:linear-gradient(transparent 60%,var(--accent-soft) 60%);padding:0 1px}
  .exhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .exnav{display:flex;align-items:center;gap:8px}
  .exnav .idx{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .exnav button{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 12px;font-size:12.5px;font-weight:700;color:var(--accent);cursor:pointer;font-family:inherit;transition:.14s}
  .exnav button:hover{background:var(--accent-soft)}
  .exwrap{border:1px solid var(--line);border-radius:16px;padding:16px 16px;background:var(--soft)}
  .passage{font-family:"Newsreader",serif;font-size:15px;line-height:1.65;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 15px}
  .passage u{text-decoration:none;border-bottom:2px solid var(--accent);font-weight:600;padding:0 1px}
  .qstem{font-size:13.5px;font-weight:700;margin:14px 0 10px}
  .opts{display:flex;flex-direction:column;gap:8px}
  .opt{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 13px;font-size:13.5px;text-align:left;cursor:pointer;font-family:inherit;color:var(--ink);transition:.14s;line-height:1.45}
  .opt:hover{border-color:var(--accent)}
  .opt.correct{background:var(--ok-soft);border-color:var(--ok);color:#04663f;font-weight:700}
  .opt.wrong{background:var(--no-soft);border-color:var(--no);color:#9b1c31}
  .opt:disabled{cursor:default}
  .exp{margin-top:12px;font-size:13px;line-height:1.6;background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:12px 14px;display:none}
  .exp.show{display:block}
  .exp .a{font-weight:800;color:var(--ok);margin-bottom:5px}
  .exp b{color:var(--accent)}
  .foot{text-align:center;font-size:11px;color:var(--muted);margin-top:22px;line-height:1.5}
</style>
</head>
<body>
<div class="app">
  <div class="kicker">Magic English · CSAT</div><div class="name">수능 유형별 공략실</div>
  <p class="lead">유형을 선택하면 접근 순서 · 함정 · 팁과 함께 <b>유형당 2개의 예제</b>를 직접 풀 수 있어요. (예문은 학습용 자작 지문)</p>
  <div class="grid" id="grid" role="tablist"></div>
  <div class="detail" id="detail"></div>
  <div class="foot">전략을 익힌 뒤 예제로 확인하고, '다음 예제'로 같은 유형을 한 번 더 연습하세요.</div>
</div>
<script>

 {em:"🚫",name:"무관한 문장",oneline:"글의 흐름과 관계없는 한 문장을 고르는 유형.",

   {p:"We often think we need big changes to improve our lives. But tiny daily habits — a short walk, ten minutes of reading, a glass of water — add up over time. Small actions, repeated, quietly shape who we become.",

    exp:"주제는 '작은 습관이 쌓여 삶을 바꾼다'. ②가 이를 <b>포괄</b>. ④⑤는 예시에 불과한 지엽적 선지."},
   {p:"You don't need to feel ready to begin. Confidence is not what gets you started; it is what you gain after you start and keep going. Waiting until you feel ready is often just a way of waiting forever.",
    q:"글의 요지로 가장 적절한 것은?",opts:["완벽히 준비된 뒤에 시작해야 한다","자신감은 시작한 뒤에 생기므로 일단 시작하라","자신감이 없으면 성공할 수 없다","계획 수립이 성공의 핵심이다","실패를 결코 두려워하지 마라"],ans:1,
    exp:"자신감은 시작한 '후에' 얻는 것 → <b>준비되길 기다리지 말고 일단 시작하라</b>가 요지. ①은 정반대."}
  ]},
 {em:"📝",name:"요약문",oneline:"글을 한 문장으로 요약한 빈칸 (A)(B)를 채우는 유형.",
  steps:["요약문 구조로 글의 <b class='hl'>논리(원인→결과, 대조)</b>를 먼저 파악한다.","본문 주제와 핵심 관계를 두 빈칸에 대응시킨다.","(A)(B)는 세트 — <b class='hl'>둘 다 맞는 조합</b>을 고른다."],
  traps:["(A)만 맞는 조합","본문 어휘를 그대로 쓴 함정"],
  tip:"<b>요약문을 먼저</b> 읽으면 본문에서 무엇을 찾을지 보인다.",
  exs:[
   {p:"In one study, people who wrote their goals down were far more likely to achieve them than those who only thought about them. Putting a goal into words makes it concrete and easier to act on.<br><br>→ Writing goals down makes them more <b>(A)</b>, which raises the <b>(B)</b> of achieving them.",
    q:"(A), (B)에 들어갈 말로 알맞은 것은?",opts:["(A) concrete … (B) likelihood","(A) vague … (B) likelihood","(A) concrete … (B) difficulty","(A) vague … (B) difficulty","(A) concrete … (B) cost"],ans:0,
    exp:"적으면 목표가 <b>구체적(concrete)</b>이 되고 → 달성 <b>가능성(likelihood)</b>이 커진다. (A)(B) 둘 다 맞는 ①."},
   {p:"Researchers offered children one marshmallow now, or two if they could wait fifteen minutes. Years later, those who had waited tended to do better in school. The ability to delay a small reward predicted greater long-term success.<br><br>→ Children who could <b>(A)</b> an immediate reward tended to succeed more <b>(B)</b>.",
    q:"(A), (B)에 들어갈 말로 알맞은 것은?",opts:["(A) resist … (B) later","(A) demand … (B) later","(A) resist … (B) immediately","(A) ignore … (B) rarely","(A) demand … (B) immediately"],ans:0,
    exp:"즉각적 보상을 <b>참는(resist)</b> 아이가 <b>나중에(later)</b> 더 성공. 둘 다 맞는 ①."}
  ]},
 {em:"📊",name:"도표",oneline:"도표와 일치하지 않는 문장을 찾는 유형.",
  steps:["도표의 <b class='hl'>제목·단위·범례</b>를 확인한다.","각 선지의 비교 표현을 수치와 대조한다.","<b class='hl'>배수·증감·순위</b> 표현을 꼼꼼히 검산한다."],
  traps:["배수(twice) 오류","증가·감소 뒤바꿈","the most ↔ the least"],
  tip:"<b>비교급·최상급·배수</b> 표현만 집중 검산하면 대부분 잡힌다.",
  exs:[
   {p:"[도표] 100명 학생의 좋아하는 과목: <b>Math 40, English 30, Science 20, Art 10</b>",
    q:"도표와 일치하지 <b>않는</b> 것은?",opts:["Math was the most popular subject.","English was chosen by 30 students.","Science was twice as popular as Art.","Art was the least popular subject.","English was more popular than Math."],ans:4,
    exp:"⑤ English(30) < Math(40)이므로 'more popular than Math'는 <b>사실과 반대</b>. ③ Science20 = 2×Art10, 맞음."},
   {p:"[도표] 하루 스마트폰 사용 시간 (학생 200명): <b>1시간 미만 20, 1–2시간 40, 2–3시간 80, 3시간 이상 60</b>",
    q:"도표와 일치하지 <b>않는</b> 것은?",opts:["The 2–3 hour group was the largest.","Twice as many students used phones 1–2 hours as under 1 hour.","Fewer students used phones over 3 hours than 2–3 hours.","The '3 hours or more' group was the smallest.","More than half used phones for at least 2 hours."],ans:3,
    exp:"가장 적은 집단은 '1시간 미만(20)'이다. '3시간 이상(60)'은 최소가 아니므로 ④가 <b>사실과 다름</b>. ② 40 = 2×20, 맞음."}
  ]},
 {em:"🔤",name:"어휘",oneline:"문맥상 낱말의 쓰임이 적절/부적절한지 판단하는 유형.",
  steps:["글의 <b class='hl'>논지 방향</b>(긍정/부정)을 파악한다.","밑줄 낱말에 <b class='hl'>반의어를 대입</b>해 어느 쪽이 자연스러운지 본다."],
  traps:["철자가 비슷한 혼동어","논지와 반대되는 낱말"],
  tip:"밑줄에 <b>반의어를 넣어 더 자연스러우면</b>, 그 낱말이 오답이다.",
  exs:[
   {p:"A good leader listens carefully. Rather than ignoring different opinions, she <u>①welcomes</u> them, which makes the team feel <u>②valued</u>. Such openness <u>③weakens</u> trust and keeps everyone motivated.",
    q:"문맥상 낱말의 쓰임이 <b>적절하지 않은</b> 것은?",opts:["①","②","③"],ans:2,
    exp:"논지는 긍정(개방성이 신뢰를 높임). ③ weakens(약화)는 흐름과 반대 → <b>strengthens</b>가 자연스럽다."},
   {p:"Spending time in nature can <u>①reduce</u> stress. Even a short walk in a park lowers heart rate and helps people feel <u>②calmer</u>. Employers who add green spaces often report <u>③less</u> productive workers as a result.",
    q:"문맥상 낱말의 쓰임이 <b>적절하지 않은</b> 것은?",opts:["①","②","③"],ans:2,
    exp:"논지는 자연의 긍정적 효과. ③ less productive(생산성 감소)는 반대 → <b>more</b> productive가 자연스럽다."}
  ]}
];
const grid=document.getElementById("grid"),detail=document.getElementById("detail");
let curType=0,exIdx=0;
TYPES.forEach((t,i)=>{const b=document.createElement("button");b.className="chip";b.setAttribute("role","tab");b.dataset.i=i;
  b.innerHTML=`<div class="em">${t.em}</div><div class="t">${t.name}</div>`;b.onclick=()=>{curType=i;exIdx=0;render();};grid.appendChild(b);});

function render(){
  [...grid.children].forEach((c,j)=>c.setAttribute("aria-selected",j===curType?"true":"false"));
  const t=TYPES[curType];
  detail.innerHTML=`
    <div class="dhead"><span class="big">${t.em}</span><h2>${t.name}</h2></div>
    <div class="oneline">${t.oneline}</div>
    <div class="sec"><span class="lab steps">🧭 접근 순서</span><ol class="steps">${t.steps.map(s=>`<li>${s}</li>`).join("")}</ol></div>
    <div class="sec"><span class="lab traps">함정 주의</span><ul class="traps">${t.traps.map(s=>`<li>${s}</li>`).join("")}</ul></div>
    <div class="sec"><span class="lab tip">핵심 팁</span><div class="tipbox">${t.tip}</div></div>
    <div class="sec">
      <div class="exhead"><span class="lab ex" style="margin:0">✏️ 예제로 확인</span>
        <div class="exnav"><span class="idx">예제 ${exIdx+1} / ${t.exs.length}</span>
          <button id="nextEx">다음 예제 →</button></div>
      </div>
      <div id="exhost"></div>
    </div>`;
  detail.querySelector("#nextEx").onclick=()=>{exIdx=(exIdx+1)%t.exs.length;render();detail.querySelector("#exhost").scrollIntoView({behavior:"smooth",block:"nearest"});};
  renderExample(t.exs[exIdx]);
  detail.scrollIntoView({behavior:"smooth",block:"nearest"});
}
function renderExample(e){
  const host=detail.querySelector("#exhost");
  host.innerHTML=`<div class="exwrap">
    <div class="passage">${e.p}</div>
    <div class="qstem">${e.q}</div>
    <div class="opts" id="opts"></div>
    <div class="exp" id="exp"><div class="a"></div><div id="expText"></div></div>
  </div>`;
  const box=host.querySelector("#opts");
  e.opts.forEach((o,idx)=>{const b=document.createElement("button");b.className="opt";
    b.innerHTML=`<b>${idx+1}.</b> ${o}`;b.onclick=()=>answer(idx,e,box);box.appendChild(b);});
}
function answer(idx,e,box){
  [...box.children].forEach(x=>x.disabled=true);
  if(idx===e.ans){box.children[idx].classList.add("correct");}
  else{box.children[idx].classList.add("wrong");box.children[e.ans].classList.add("correct");}
  const exp=detail.querySelector("#exp");exp.classList.add("show");
  exp.querySelector(".a").textContent=(idx===e.ans?"정답입니다! ✓ ":"아쉬워요 ✗ ")+`정답은 ${e.ans+1}번`;
  detail.querySelector("#expText").innerHTML=e.exp;
}
render();
</script>
