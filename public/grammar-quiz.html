<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>어법 O/X 퀴즈 · MAGIC ENGLISH</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  :root{--bg:#eceef5;--surface:#fff;--ink:#1f2438;--muted:#6b7185;--line:#e2e5ef;--soft:#f4f5fa;
    --accent:#7c3aed;--accent-soft:#f0e9fe;--ok:#059669;--ok-soft:#e7f6ef;--no:#e11d48;--no-soft:#fdecec;
    --shadow:0 18px 44px -22px rgba(31,36,56,.4);--radius:20px;
    font-family:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink)}
  body{min-height:100vh;display:flex;justify-content:center;padding:22px 14px 40px;-webkit-font-smoothing:antialiased}
  .app{width:100%;max-width:560px}
  .bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
  .brand{display:flex;flex-direction:column;line-height:1.15}
  .brand .kicker{font-size:11px;letter-spacing:.18em;font-weight:700;color:var(--accent);text-transform:uppercase}
  .brand .name{font-size:18px;font-weight:800;letter-spacing:-.01em}
  .prog{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px;box-shadow:var(--shadow);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
  .track{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:20px}
  .fill{height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .3s ease}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px 24px}
  .topic{font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:4px 11px;border-radius:99px;display:inline-block}
  .ask{font-size:12.5px;color:var(--muted);margin:16px 0 6px}
  .sentence{font-family:"Newsreader",serif;font-size:clamp(20px,5vw,25px);line-height:1.55;color:var(--ink)}
  .sentence u{text-decoration:none;font-weight:600;background:linear-gradient(transparent 58%,var(--accent-soft) 58%);padding:0 2px;border-bottom:2px solid var(--accent)}
  .ox{display:flex;gap:12px;margin-top:22px}
  .oxbtn{flex:1;border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:20px 0;cursor:pointer;transition:.15s;font-family:inherit}
  .oxbtn .big{font-size:30px;font-weight:800;line-height:1}
  .oxbtn .lab{font-size:12px;color:var(--muted);margin-top:6px;font-weight:600}
  .oxbtn:hover{transform:translateY(-2px)}
  .oxbtn:focus-visible{outline:3px solid var(--accent-soft);outline-offset:2px}
  .oxbtn.o .big{color:var(--ok)} .oxbtn.x .big{color:var(--no)}
  .oxbtn:disabled{cursor:default;opacity:.5}
  .oxbtn.picked-o{background:var(--ok-soft);border-color:var(--ok);opacity:1}
  .oxbtn.picked-x{background:var(--no-soft);border-color:var(--no);opacity:1}
  .verdict{margin-top:20px;border-radius:14px;padding:16px 16px;font-size:13.5px;line-height:1.6;display:none}
  .verdict.show{display:block}
  .verdict.right{background:var(--ok-soft);border:1px solid #b7e4cd}
  .verdict.wrong{background:var(--no-soft);border:1px solid #f4c2cd}
  .verdict .head{font-weight:800;font-size:14px;margin-bottom:6px}
  .verdict.right .head{color:#04663f} .verdict.wrong .head{color:#a01230}
  .verdict .fix{margin-top:8px;font-size:13px;background:#fff;border-radius:10px;padding:9px 11px;border:1px dashed var(--line)}
  .verdict .fix b{color:var(--accent)}
  .next{width:100%;margin-top:16px;border:none;background:var(--accent);color:#fff;border-radius:14px;padding:15px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;display:none}
  .next.show{display:block}
  .next:focus-visible{outline:3px solid var(--accent-soft);outline-offset:2px}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px 22px;text-align:center}
  .panel h2{font-size:21px;font-weight:800}
  .score{font-family:"Newsreader",serif;font-size:56px;font-weight:600;color:var(--accent);margin:14px 0 2px}
  .score small{font-size:24px;color:var(--muted)}
  .panel p{font-size:13.5px;color:var(--muted);line-height:1.55}
  .grade{font-size:15px;font-weight:800;margin-top:8px}
  .row{display:flex;gap:10px;margin-top:20px}
  .btn{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;font-size:14.5px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink);transition:.15s}
  .btn:hover{transform:translateY(-1px)} .btn.solid{background:var(--accent);color:#fff;border-color:transparent}
  .btn:disabled{opacity:.4;cursor:default;transform:none}
  .rev{text-align:left;margin-top:8px}
  .rev .item{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px;font-size:13px;line-height:1.5}
  .rev .item .s{font-family:"Newsreader",serif;font-size:15px;margin-bottom:4px}
  .rev .item .s u{text-decoration:none;border-bottom:2px solid var(--no);font-weight:600}
  .foot{text-align:center;font-size:11px;color:var(--muted);margin-top:22px;line-height:1.5}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <div class="brand"><span class="kicker">Magic English · Grammar</span><span class="name">어법 O/X 퀴즈</span></div>
    <div class="prog" id="prog">1 / 10</div>
  </div>
  <div class="track"><div class="fill" id="fill"></div></div>
  <div id="view"></div>
  <div class="foot">밑줄 친 부분이 어법상 맞으면 <b>O</b>, 틀리면 <b>X</b> · 매 라운드 문제가 섞여 나옵니다.</div>
</div>
<script>
/* correct:true = 밑줄 부분이 어법상 옳음(O). false = 틀림(X). */
const BANK=[
  {topic:"수 일치", s:"The number of visitors <u>has</u> risen sharply.", correct:true,
   why:"'the number of + 복수명사'는 '~의 수'라는 하나의 개념이라 단수 취급 → has가 맞습니다.", fix:""},
  {topic:"수 일치", s:"A number of students <u>was</u> absent today.", correct:false,
   why:"'a number of'는 '많은'이라는 뜻으로 복수 취급합니다.", fix:"was → <b>were</b>"},
  {topic:"관계부사", s:"This is the town <u>where</u> I grew up.", correct:true,
   why:"뒤 문장(I grew up)이 빠진 성분 없이 완전하므로 관계부사 where가 맞습니다.", fix:""},
  {topic:"관계대명사", s:"This is the town <u>which</u> I grew up.", correct:false,
   why:"뒤가 완전한 절이라 목적격 관계대명사 which는 쓸 수 없습니다.", fix:"which → <b>where</b> 또는 <b>in which</b>"},
  {topic:"병렬 구조", s:"She is smart, kind, and <u>generous</u>.", correct:true,
   why:"형용사 세 개가 and로 대등하게 연결된 올바른 병렬입니다.", fix:""},
  {topic:"병렬 구조", s:"He spent the day cooking, cleaning, and <u>to shop</u>.", correct:false,
   why:"앞의 동명사(cooking, cleaning)와 형태를 맞춰야 합니다.", fix:"to shop → <b>shopping</b>"},
  {topic:"동명사 목적어", s:"I avoid <u>eating</u> late at night.", correct:true,
   why:"avoid는 목적어로 동명사만 취합니다.", fix:""},
  {topic:"동명사 목적어", s:"Would you mind <u>to open</u> the window?", correct:false,
   why:"mind는 동명사를 목적어로 취합니다.", fix:"to open → <b>opening</b>"},
  {topic:"감정 분사", s:"The results were <u>disappointing</u>.", correct:true,
   why:"결과가 실망을 '주는' 주체이므로 현재분사가 맞습니다.", fix:""},
  {topic:"감정 분사", s:"The fans were <u>boring</u> during the long delay.", correct:false,
   why:"팬들은 지루함을 '느끼는' 대상이므로 과거분사를 씁니다.", fix:"boring → <b>bored</b>"},
  {topic:"진행 수동태", s:"The road <u>is being repaired</u> this week.", correct:true,
   why:"'be being + p.p.' 진행형 수동태가 정확히 쓰였습니다.", fix:""},
  {topic:"수동태", s:"A cake <u>is baking</u> by my mom right now.", correct:false,
   why:"행위자(by my mom)가 있으므로 수동태여야 합니다.", fix:"is baking → <b>is being baked</b>"},
  {topic:"가정법 과거", s:"If I <u>knew</u> the answer, I would tell you.", correct:true,
   why:"현재 사실의 반대를 가정하는 가정법 과거로 if절에 과거동사가 맞습니다.", fix:""},
  {topic:"부사", s:"The team played <u>well</u> in yesterday's match.", correct:true,
   why:"동사 played를 수식하므로 good의 부사형 well이 맞습니다.", fix:""},
  {topic:"부사", s:"She sings <u>beautiful</u> on stage.", correct:false,
   why:"동사 sings를 수식하므로 부사가 필요합니다.", fix:"beautiful → <b>beautifully</b>"},
  {topic:"부정어 도치", s:"Rarely <u>have I seen</u> such courage.", correct:true,
   why:"부정어(Rarely)가 문두에 오면 '조동사+주어' 어순으로 도치됩니다.", fix:""},
  {topic:"시제 일치", s:"Yesterday she <u>goes</u> to the library after class.", correct:false,
   why:"Yesterday(과거 시점)와 함께 쓰였으므로 과거시제가 필요합니다.", fix:"goes → <b>went</b>"},
  {topic:"to부정사", s:"He decided <u>to study</u> abroad next year.", correct:true,
   why:"decide는 to부정사를 목적어로 취합니다.", fix:""}
];
const ROUND=10;

const store=(()=>{let ok=true;try{localStorage.setItem("__t","1");localStorage.removeItem("__t");}catch(e){ok=false;}const m={};
  return{get:k=>{try{return ok?localStorage.getItem(k):(m[k]??null);}catch(e){return m[k]??null;}},set:(k,v)=>{try{ok?localStorage.setItem(k,v):(m[k]=v);}catch(e){m[k]=v;}}};})();
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

let list=[],pos=0,correct=0,wrong=[];
function start(){list=shuffle(BANK).slice(0,Math.min(ROUND,BANK.length));pos=0;correct=0;wrong=[];render();}
start();

function render(){
  document.getElementById("prog").textContent=`${pos+1} / ${list.length}`;
  document.getElementById("fill").style.width=(pos/list.length*100)+"%";
  const q=list[pos],view=document.getElementById("view");
  view.innerHTML=`<div class="card">
    <span class="topic">${q.topic}</span>
    <div class="ask">밑줄 친 부분이 어법상 맞나요?</div>
    <div class="sentence">${q.s}</div>
    <div class="ox">
      <button class="oxbtn o" id="oBtn"><div class="big">O</div><div class="lab">맞다</div></button>
      <button class="oxbtn x" id="xBtn"><div class="big">X</div><div class="lab">틀리다</div></button>
    </div>
    <div class="verdict" id="verdict"></div>
    <button class="next" id="next">${pos<list.length-1?"다음 문제 →":"결과 보기 →"}</button>
  </div>`;
  view.querySelector("#oBtn").onclick=()=>answer(true);
  view.querySelector("#xBtn").onclick=()=>answer(false);
  view.querySelector("#next").onclick=()=>{if(pos<list.length-1){pos++;render();}else result();};
}
function answer(pick){
  const q=list[pos];
  document.getElementById("oBtn").disabled=true;document.getElementById("xBtn").disabled=true;
  document.getElementById(pick?"oBtn":"xBtn").classList.add(pick?"picked-o":"picked-x");
  const ok=(pick===q.correct);
  if(ok)correct++;else wrong.push(q);
  const v=document.getElementById("verdict");
  v.className="verdict show "+(ok?"right":"wrong");
  v.innerHTML=`<div class="head">${ok?"정답! ✓":"오답 ✗"} · 정답은 ${q.correct?"O (맞다)":"X (틀리다)"}</div>
    <div>${q.why}</div>${q.fix?`<div class="fix">✍️ ${q.fix}</div>`:``}`;
  document.getElementById("next").classList.add("show");
  document.getElementById("fill").style.width=((pos+1)/list.length*100)+"%";
}
function result(){
  const total=list.length,pct=Math.round(correct/total*100);
  const grade=pct>=90?["최상위권 어법 감각! 🏆","#059669"]:pct>=70?["안정권, 실수만 줄이면 완벽 👍","#4f46e5"]:pct>=50?["기본은 탄탄, 오답 복습 필수 💪","#d97706"]:["개념부터 다시 다져봐요 📖","#e11d48"];
  const best=Math.max(parseInt(store.get("gq_best")||"0",10),correct);store.set("gq_best",String(best));
  const view=document.getElementById("view");
  view.innerHTML=`<div class="panel">
    <h2>어법 퀴즈 결과</h2>
    <div class="score">${correct}<small> / ${total}</small></div>
    <div class="grade" style="color:${grade[1]}">${grade[0]}</div>
    <p>정답률 ${pct}% · 최고 기록 ${best} / ${total}</p>
    ${wrong.length?`<div class="rev"><div style="font-weight:800;font-size:13px;margin-top:16px">틀린 문제 다시 보기</div>${wrong.map(q=>`<div class="item"><div class="s">${q.s}</div><div style="color:var(--muted)">정답 ${q.correct?"O":"X"} · ${q.why} ${q.fix?"("+q.fix.replace(/<[^>]+>/g,"")+")":""}</div></div>`).join("")}</div>`:`<p style="margin-top:14px;color:var(--ok);font-weight:700">전부 정답! 완벽해요 🎉</p>`}
    <div class="row"><button class="btn solid" id="again">다시 풀기 (새 문제)</button></div>
  </div>`;
  document.getElementById("fill").style.width="100%";
  view.querySelector("#again").onclick=start;
}
</script>
</body>
</html>
