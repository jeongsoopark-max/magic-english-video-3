<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>방문 통계 · MAGIC ENGLISH</title>
<style>
  :root {
    --paper:  #f3f6f5;
    --card:   #ffffff;
    --ink:    #17262b;
    --muted:  #64777d;
    --line:   #dbe3e2;
    --web:    #0d6e5f;
    --room:   #7c3f6d;
    --radius: 4px;
    --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,
            "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 24px 72px;
    background: var(--paper); color: var(--ink);
    font-family: var(--font); font-size: 15px; line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1120px; margin: 0 auto; }

  header.top { display: flex; align-items: baseline; justify-content: space-between;
               flex-wrap: wrap; gap: 16px; margin-bottom: 28px; }
  header.top h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
  header.top p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }

  .range { display: flex; gap: 2px; }
  .range button { font: inherit; font-size: 14px; padding: 6px 14px; cursor: pointer;
                  background: transparent; color: var(--muted); border: 1px solid var(--line); }
  .range button:first-child { border-radius: var(--radius) 0 0 var(--radius); }
  .range button:last-child  { border-radius: 0 var(--radius) var(--radius) 0; }
  .range button + button { border-left: none; }
  .range button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--web); outline-offset: 2px; }

  section { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); }
  section + section, .grid { margin-top: 20px; }
  .grid { display: grid; gap: 20px; grid-template-columns: 1fr 1fr; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }

  .head { display: flex; align-items: center; justify-content: space-between;
          gap: 12px; padding: 16px 20px 0; }
  .head h2 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
  .head .note { color: var(--muted); font-size: 13px; }
  .body { padding: 16px 20px 20px; }

  .hero { border-color: var(--ink); }
  .src { display: flex; gap: 2px; }
  .src button { font: inherit; font-size: 13px; padding: 5px 12px; cursor: pointer;
                background: transparent; border: 1px solid var(--line);
                color: var(--muted); border-radius: var(--radius); }
  .src button[data-src="web"][aria-pressed="true"]  { background: var(--web); color: #fff; border-color: transparent; }
  .src button[data-src="room"][aria-pressed="true"] { background: var(--room); color: #fff; border-color: transparent; }

  .heat { display: grid; grid-template-columns: 34px 1fr; gap: 6px; align-items: center; }
  .heat .hours { grid-column: 2; display: grid; grid-template-columns: repeat(24, 1fr);
                 font-size: 11px; color: var(--muted); margin-bottom: 2px; }
  .heat .day { font-size: 12px; color: var(--muted); text-align: right; padding-right: 2px; }
  .heat .row { display: grid; grid-template-columns: repeat(24, 1fr); gap: 2px; }
  .heat .cell { aspect-ratio: 1 / 1; border-radius: 2px; background: #eef1f0; min-height: 14px; }
  .heat .cell[data-v]:hover { outline: 2px solid var(--ink); }
  .heat .sat { color: #2f6ea8; }
  .heat .sun { color: #a83f3f; }

  .legend { display: flex; align-items: center; gap: 8px; margin-top: 14px;
            font-size: 12px; color: var(--muted); }
  .legend i { width: 18px; height: 10px; border-radius: 2px; display: inline-block; }

  .band { display: flex; flex-wrap: wrap; margin: 0; }
  .band div { flex: 1 1 150px; padding: 18px 20px; border-right: 1px solid var(--line); }
  .band div:last-child { border-right: none; }
  .band dt { margin: 0; font-size: 13px; color: var(--muted); }
  .band dd { margin: 2px 0 0; font-size: 24px; font-weight: 700;
             letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .band dd small { font-size: 14px; font-weight: 500; color: var(--muted); margin-left: 2px; }
  @media (max-width: 640px) { .band div { border-right: none; border-bottom: 1px solid var(--line); } }

  svg { display: block; width: 100%; height: auto; overflow: visible; }
  .axis { font-size: 11px; fill: var(--muted); }
  .gridline { stroke: var(--line); stroke-width: 1; }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 7px 8px; text-align: left; border-bottom: 1px solid var(--line); }
  th { font-weight: 600; font-size: 13px; color: var(--muted); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tbody tr:last-child td { border-bottom: none; }
  .bar { height: 6px; background: var(--web); border-radius: 3px; }
  .tag { display: inline-block; font-size: 11px; padding: 1px 5px; border-radius: 2px;
         background: #eef1f0; color: var(--muted); margin-left: 5px; }
  .empty { color: var(--muted); font-size: 14px; padding: 8px 0; }
  .swatch { display: inline-block; width: 9px; height: 9px; border-radius: 2px;
            margin-right: 6px; vertical-align: middle; }

  /* 로그인 */
  #gate { max-width: 340px; margin: 12vh auto; }
  #gate h1 { font-size: 20px; margin: 0 0 6px; }
  #gate p { color: var(--muted); font-size: 14px; margin: 0 0 18px; }
  #gate input { width: 100%; font: inherit; padding: 9px 11px; margin-bottom: 10px;
                border: 1px solid var(--line); border-radius: var(--radius); }
  #gate button { width: 100%; font: inherit; padding: 9px; cursor: pointer;
                 background: var(--ink); color: #fff; border: none; border-radius: var(--radius); }
  #gateMsg { color: #a83f3f; font-size: 13px; min-height: 20px; margin: 8px 0 0; }
</style>
</head>
<body>

<div id="gate" hidden>
  <h1>방문 통계</h1>
  <p>관리자 비밀번호를 입력하세요.</p>
  <input id="pw" type="password" autocomplete="current-password" placeholder="비밀번호">
  <button id="go">열기</button>
  <p id="gateMsg"></p>
</div>

<div class="wrap" id="app" hidden>
  <header class="top">
    <div>
      <h1>방문 통계</h1>
      <p>홈페이지 방문과 수업방 접속을 함께 봅니다. 시각은 한국 시간 기준입니다.</p>
    </div>
    <div class="range" id="range">
      <button data-days="7">7일</button>
      <button data-days="30" aria-pressed="true">30일</button>
      <button data-days="90">90일</button>
    </div>
  </header>

  <section class="hero">
    <div class="head">
      <h2>요일과 시간대</h2>
      <div class="src" id="src">
        <button data-src="web" aria-pressed="true">홈페이지</button>
        <button data-src="room">수업방</button>
      </div>
    </div>
    <div class="body">
      <div class="heat" id="heat"></div>
      <div class="legend">
        <span>적음</span>
        <i style="background:#eef1f0"></i>
        <i id="lg1"></i><i id="lg2"></i><i id="lg3"></i><i id="lg4"></i>
        <span>많음</span>
        <span id="heatNote" style="margin-left:auto"></span>
      </div>
    </div>
  </section>

  <section><dl class="band" id="band"></dl></section>

  <div class="grid">
    <section>
      <div class="head">
        <h2>일별 추이</h2>
        <span class="note">
          <span class="swatch" style="background:var(--web)"></span>방문자
          <span class="swatch" style="background:var(--room);margin-left:10px"></span>수업방 접속
        </span>
      </div>
      <div class="body"><div id="daily"></div></div>
    </section>
    <section>
      <div class="head"><h2>홈페이지 체류 시간</h2></div>
      <div class="body"><div id="duration"></div></div>
    </section>
  </div>

  <div class="grid">
    <section>
      <div class="head"><h2>많이 본 페이지</h2></div>
      <div class="body"><div id="pages"></div></div>
    </section>
    <section>
      <div class="head"><h2>기기와 유입</h2></div>
      <div class="body"><div id="breakdown"></div></div>
    </section>
  </div>

  <section>
    <div class="head"><h2>반별 수업방 이용</h2></div>
    <div class="body"><div id="rooms"></div></div>
  </section>

  <section>
    <div class="head">
      <h2>수업방 참여자</h2>
      <span class="note">들어왔다 나간 기록만 집계</span>
    </div>
    <div class="body"><div id="participants"></div></div>
  </section>
</div>

<script>
(function () {
  'use strict';

  var DAYS = ['일','월','화','수','목','금','토'];
  var ROOM_KO = { basic:'기초 B', grammar:'문법 G', intermediate:'중급 I',
                  advanced:'심화 A', private:'개인 P' };
  var state = { days: 30, src: 'web' };
  var token = null;
  var $ = function (id) { return document.getElementById(id); };

  // 관리자 토큰은 "admin.<만료시각>.<서명>" 형태다. 출결 관리 화면이 이미
  // 로그인해 뒀다면 저장 키 이름을 몰라도 이 모양으로 찾아낼 수 있다.
  var TOKEN_RE = /^admin\.\d+\.[0-9a-f]{32,}$/;
  function findStoredToken() {
    var stores = [window.localStorage, window.sessionStorage];
    for (var i = 0; i < stores.length; i++) {
      try {
        for (var k = 0; k < stores[i].length; k++) {
          var v = stores[i].getItem(stores[i].key(k));
          if (v && TOKEN_RE.test(v) && Date.now() < Number(v.split('.')[1])) return v;
        }
      } catch (e) { /* 프라이빗 모드 */ }
    }
    return null;
  }

  function api(path) {
    return fetch('/api/admin/stats/' + path +
                 (path.indexOf('?') < 0 ? '?' : '&') + 'days=' + state.days,
                 { headers: { Authorization: 'Bearer ' + token } })
      .then(function (r) {
        if (r.status === 401) { token = null; showGate('로그인이 만료되었습니다.'); throw new Error('401'); }
        if (!r.ok) throw new Error(r.status);
        return r.json();
      });
  }

  function dur(s) {
    s = Math.round(s || 0);
    if (s < 60) return s + '초';
    var m = Math.floor(s / 60);
    if (m < 60) return m + '분';
    return Math.floor(m / 60) + '시간 ' + (m % 60) + '분';
  }
  function esc(t) {
    return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) {
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c];
    });
  }
  function fail(el, msg) { $(el).innerHTML = '<p class="empty">' + esc(msg) + '</p>'; }
  function roomName(id) { return ROOM_KO[id] || id; }

  // ── 히트맵 ────────────────────────────────────────────
  function drawHeat(data) {
    var accent = state.src === 'room' ? [124,63,109] : [13,110,95];
    var map = {}, max = 0;
    data.cells.forEach(function (c) {
      map[c.dow + ':' + c.hour] = c.value;
      if (c.value > max) max = c.value;
    });
    [1,2,3,4].forEach(function (n) {
      $('lg' + n).style.background = 'rgba(' + accent.join(',') + ',' + (n * 0.24) + ')';
    });

    var html = '<div></div><div class="hours">';
    for (var h = 0; h < 24; h++) html += '<span>' + (h % 3 === 0 ? h : '') + '</span>';
    html += '</div>';
    for (var d = 0; d < 7; d++) {
      html += '<div class="day' + (d === 0 ? ' sun' : d === 6 ? ' sat' : '') + '">' +
              DAYS[d] + '</div><div class="row">';
      for (var hh = 0; hh < 24; hh++) {
        var v = map[d + ':' + hh] || 0;
        var a = max ? 0.12 + (v / max) * 0.88 : 0;
        html += '<div class="cell" data-v="' + v + '" style="' +
                (v ? 'background:rgba(' + accent.join(',') + ',' + a.toFixed(2) + ')' : '') +
                '" title="' + DAYS[d] + '요일 ' + hh + '시 · ' + v + '"></div>';
      }
      html += '</div>';
    }
    $('heat').innerHTML = html;
    $('heatNote').textContent = max
      ? '가장 많은 칸 ' + max + ' · ' + (state.src === 'room' ? '접속 수' : '방문자 수')
      : '기록 없음';
  }

  function drawBand(s) {
    var items = [
      ['방문자', s.web.visitors, ''],
      ['재방문한 사람', s.web.repeat_visitors, ''],
      ['평균 체류', dur(s.web.avg_sec), ''],
      ['수업방 접속', s.room.sessions, '회'],
      ['수업 누적 시간', dur(s.room.total_sec), ''],
      ['평균 참여 시간', dur(s.room.avg_sec), '']
    ];
    $('band').innerHTML = items.map(function (i) {
      return '<div><dt>' + i[0] + '</dt><dd>' + esc(i[1]) +
             (i[2] ? '<small>' + i[2] + '</small>' : '') + '</dd></div>';
    }).join('');
  }

  function drawDaily(rows) {
    if (!rows.length) return fail('daily', '아직 기록이 없습니다.');
    var W = 560, H = 200, P = { t:12, r:8, b:24, l:32 };
    var iw = W - P.l - P.r, ih = H - P.t - P.b;
    var max = 1;
    rows.forEach(function (r) { max = Math.max(max, r.visitors, r.joins); });
    var step = rows.length > 1 ? iw / (rows.length - 1) : 0;
    var x = function (i) { return P.l + i * step; };
    var y = function (v) { return P.t + ih - (v / max) * ih; };

    function line(key, color) {
      return '<path d="' + rows.map(function (r, i) {
        return (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(r[key]).toFixed(1);
      }).join(' ') + '" fill="none" stroke="' + color +
      '" stroke-width="2" stroke-linejoin="round"/>';
    }

    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="일별 추이">';
    [0, 0.5, 1].forEach(function (f) {
      var v = Math.round(max * f), yy = y(v);
      svg += '<line class="gridline" x1="' + P.l + '" x2="' + (W - P.r) +
             '" y1="' + yy + '" y2="' + yy + '"/>' +
             '<text class="axis" x="0" y="' + (yy + 4) + '">' + v + '</text>';
    });
    svg += line('visitors', '#0d6e5f') + line('joins', '#7c3f6d');
    var ticks = Math.min(6, rows.length);
    for (var t = 0; t < ticks; t++) {
      var i = Math.round(t * (rows.length - 1) / Math.max(1, ticks - 1));
      svg += '<text class="axis" text-anchor="middle" x="' + x(i) + '" y="' + (H - 6) +
             '">' + rows[i].day.slice(5) + '</text>';
    }
    $('daily').innerHTML = svg + '</svg>';
  }

  function bars(el, rows, color) {
    if (!rows.length) return fail(el, '아직 기록이 없습니다.');
    var max = 1;
    rows.forEach(function (r) { max = Math.max(max, r.value); });
    $(el).innerHTML = '<table><tbody>' + rows.map(function (r) {
      return '<tr><td>' + esc(r.label) + '</td>' +
             '<td style="width:45%"><div class="bar" style="width:' +
             Math.max(2, (r.value / max) * 100) + '%;background:' + (color || 'var(--web)') +
             '"></div></td><td class="num">' + r.value + '</td></tr>';
    }).join('') + '</tbody></table>';
  }

  // ── 로드 ──────────────────────────────────────────────
  function loadHeat() {
    api('heatmap?source=' + state.src).then(drawHeat)
      .catch(function () { fail('heat', '불러오지 못했습니다.'); });
  }

  function loadAll() {
    loadHeat();
    api('summary').then(drawBand).catch(function () { fail('band', '불러오지 못했습니다.'); });
    api('daily').then(function (d) { drawDaily(d.rows); })
      .catch(function () { fail('daily', '불러오지 못했습니다.'); });

    api('duration').then(function (d) {
      bars('duration', d.rows.map(function (r) { return { label: r.bucket, value: r.value }; }));
    }).catch(function () { fail('duration', '불러오지 못했습니다.'); });

    api('breakdown').then(function (d) {
      bars('pages', d.pages);

      var html = '<table><tbody>';
      d.devices.forEach(function (r) {
        html += '<tr><td>' + esc(r.label) + '</td><td class="num">' + r.value + '</td></tr>';
      });
      html += '</tbody></table><p class="empty" style="margin:14px 0 4px">유입 경로</p><table><tbody>';
      d.referrers.forEach(function (r) {
        html += '<tr><td>' + esc(r.label) + '</td><td class="num">' + r.value + '</td></tr>';
      });
      $('breakdown').innerHTML = html + '</tbody></table>';

      if (!d.rooms.length) return fail('rooms', '집계된 수업방 접속이 없습니다.');
      $('rooms').innerHTML = '<table><thead><tr><th>반</th><th class="num">접속</th>' +
        '<th class="num">누적 시간</th></tr></thead><tbody>' +
        d.rooms.map(function (r) {
          return '<tr><td>' + esc(roomName(r.label)) + '</td><td class="num">' + r.value +
                 '</td><td class="num">' + dur(r.total_sec) + '</td></tr>';
        }).join('') + '</tbody></table>';
    }).catch(function () {
      fail('pages', '불러오지 못했습니다.');
      fail('breakdown', '불러오지 못했습니다.');
      fail('rooms', '불러오지 못했습니다.');
    });

    api('participants').then(function (d) {
      if (!d.rows.length) return fail('participants', '집계된 수업방 접속이 없습니다.');
      $('participants').innerHTML =
        '<table><thead><tr><th>이름</th><th>반</th><th class="num">접속</th>' +
        '<th class="num">누적 시간</th><th class="num">평균</th>' +
        '<th class="num">마지막 접속</th></tr></thead><tbody>' +
        d.rows.map(function (r) {
          var rooms = String(r.rooms || '').split(',').filter(Boolean)
            .map(function (x) { return roomName(x); }).join(', ');
          return '<tr><td>' + esc(r.name) +
                 (r.unmatched ? '<span class="tag">미등록</span>' : '') + '</td>' +
                 '<td>' + esc(rooms) + '</td>' +
                 '<td class="num">' + r.sessions + '</td>' +
                 '<td class="num">' + dur(r.total_sec) + '</td>' +
                 '<td class="num">' + dur(r.avg_sec) + '</td>' +
                 '<td class="num">' + esc(r.last_join) + '</td></tr>';
        }).join('') + '</tbody></table>';
    }).catch(function () { fail('participants', '불러오지 못했습니다.'); });
  }

  // ── 로그인 ────────────────────────────────────────────
  function showGate(msg) {
    $('app').hidden = true;
    $('gate').hidden = false;
    $('gateMsg').textContent = msg || '';
    $('pw').focus();
  }
  function showApp() {
    $('gate').hidden = true;
    $('app').hidden = false;
    loadAll();
  }
  function login() {
    var pw = $('pw').value;
    if (!pw) return;
    $('gateMsg').textContent = '';
    fetch('/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw })
    }).then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j || !j.ok || !j.token) return showGate('비밀번호가 맞지 않습니다.');
        token = j.token;
        try { sessionStorage.setItem('adminToken', token); } catch (e) {}
        $('pw').value = '';
        showApp();
      })
      .catch(function () { showGate('서버에 연결하지 못했습니다.'); });
  }

  $('go').addEventListener('click', login);
  $('pw').addEventListener('keydown', function (e) { if (e.key === 'Enter') login(); });

  $('range').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    state.days = parseInt(b.dataset.days, 10);
    [].forEach.call(this.children, function (c) { c.setAttribute('aria-pressed', String(c === b)); });
    loadAll();
  });
  $('src').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    state.src = b.dataset.src;
    [].forEach.call(this.children, function (c) { c.setAttribute('aria-pressed', String(c === b)); });
    loadHeat();
  });

  token = findStoredToken();
  if (token) showApp(); else showGate();
})();
</script>
</body>
</html>
