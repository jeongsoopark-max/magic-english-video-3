<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>구문 끊어읽기 연습 · MAGIC ENGLISH</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  :root{--bg:#f4f6fb;--surface:#fff;--ink:#1f2438;--muted:#6b7185;--line:#e6e9f2;--soft:#f4f5fa;
    --accent:#0369a1;--accent-soft:#e0f2fe;--ok:#059669;--ok-soft:#e7f6ef;--miss:#d97706;--extra:#e11d48;
    --shadow:0 16px 40px -24px rgba(31,36,56,.35);--radius:20px;
    font-family:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink)}
  body{min-height:100vh;display:flex;justify-content:center;padding:22px 14px 40px;-webkit-font-smoothing:antialiased}
  .app{width:100%;max-width:600px}
  .bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
  .brand{display:flex;flex-direction:column;line-height:1.15}
  .brand .kicker{font-size:11px;letter-spacing:.18em;font-weight:700;color:var(--accent);text-transform:uppercase}
  .brand .name{font-size:18px;font-weight:800;letter-spacing:-.01em}
  .prog{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px;box-shadow:var(--shadow);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
  .track{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:20px}
  .fill{height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .3s ease}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px 22px}
  .rowtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .badge{font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:4px 11px;border-radius:99px}
  .spk{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;color:var(--accent);transition:.15s}
  .spk:hover{background:var(--accent-soft)} .spk.playing{background:var(--accent);color:#fff}
  .instr{font-size:12.5px;color:var(--muted);margin-bottom:14px}
  .sent{font-family:"Newsreader",serif;font-size:clamp(21px,5.2vw,27px);line-height:2;display:flex;flex-wrap:wrap;align-items:center}
  .tok{white-space:nowrap}
  .gap{display:inline-block;width:16px;text-align:center;cursor:pointer;color:transparent;font-weight:700;position:relative;border-radius:4px;transition:.12s;user-select:none}
  .gap:before{content:"·";color:#c3c8d6;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:14px}
  .gap:hover{background:var(--accent-soft)}
  .gap.on{color:var(--accent)} .gap.on:before{content:""}
  .gap.on:after{content:"/";}
  .controls{display:flex;gap:10px;margin-top:22px}
  .btn{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;font-size:14.5px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink);transition:.15s}
  .btn:hover{transform:translateY(-1px)} .btn.solid{background:var(--accent);color:#fff;border-color:transparent}
  .btn.ghost{flex:none;width:52px;color:var(--muted)}
  .result{margin-top:22px;display:none}
  .result.show{display:block}
  .matchline{font-size:13px;font-weight:700;margin-bottom:14px}
  .chunks{display:flex;flex-direction:column;gap:2px}
  .chunk{display:flex;gap:12px;align-items:baseline;padding:9px 12px;border-radius:10px;background:var(--soft)}
  .chunk .en{font-family:"Newsreader",serif;font-size:16px;font-weight:500;flex:0 0 auto;min-width:40%}
  .chunk .kr{font-size:13.5px;color:var(--muted)}
  .full{margin-top:16px;background:var(--accent-soft);border-radius:12px;padding:13px 15px;font-size:14.5px;font-weight:600;line-height:1.5;color:#0b3a5b}
  .full span{display:block;font-size:11px;font-weight:700;color:var(--accent);margin-bottom:4px;letter-spacing:.04em}
  .legend{font-size:11px;color:var(--muted);margin-top:12px;line-height:1.6}
  .legend b.g{color:var(--ok)} .legend b.m{color:var(--miss)} .legend b.e{color:var(--extra)}
  .gap.hit{background:var(--ok-soft);color:var(--ok)} .gap.hit:after{content:"/"}
  .gap.missed:before{content:"/";color:var(--miss)}
  .gap.overpick{background:#fdecec;color:var(--extra)}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px 22px;text-align:center}
  .panel h2{font-size:21px;font-weight:800}
  .score{font-family:"Newsreader",serif;font-size:52px;font-weight:600;color:var(--accent);margin:12px 0 2px}
  .panel p{font-size:13.5px;color:var(--muted);line-height:1.55}
  .foot{text-align:center;font-size:11px;color:var(--muted);margin-top:22px;line-height:1.5}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <div class="brand"><span class="kicker">Magic English · Syntax</span><span class="name">구문 끊어읽기</span></div>
    <div class="prog" id="prog">1 / 8</div>
  </div>
  <div class="track"><div class="fill" id="fill"></div></div>
  <div id="view"></div>
  <div class="foot">단어 사이를 눌러 의미 단위로 <b>끊어(/)</b> 보세요 · 확인을 누르면 모범 끊기와 직독직해가 나옵니다.</div>
</div>
<script>
/* 각 문장: chunks 배열(en=영어 의미단위, kr=직독직해), full=전체 해석 */
const SENTS=[
  {level:"기초", chunks:[{en:"I want",kr:"나는 원한다"},{en:"to learn English",kr:"영어를 배우기를"},{en:"every day",kr:"매일"}], full:"나는 매일 영어 배우기를 원한다."},
  {level:"기초", chunks:[{en:"The book",kr:"그 책은"},{en:"on the table",kr:"탁자 위에 있는"},{en:"is mine",kr:"내 것이다"}], full:"탁자 위에 있는 그 책은 내 것이다."},
  {level:"기초", chunks:[{en:"She studied hard",kr:"그녀는 열심히 공부했다"},{en:"to pass the exam",kr:"시험에 합격하기 위해"}], full:"그녀는 시험에 합격하기 위해 열심히 공부했다."},
  {level:"중급", chunks:[{en:"The man",kr:"그 남자는"},{en:"who lives next door",kr:"옆집에 사는"},{en:"is a doctor",kr:"의사이다"}], full:"옆집에 사는 그 남자는 의사이다."},
  {level:"중급", chunks:[{en:"I know",kr:"나는 안다"},{en:"that he is honest",kr:"그가 정직하다는 것을"}], full:"나는 그가 정직하다는 것을 안다."},
  {level:"중급", chunks:[{en:"Reading books",kr:"책을 읽는 것은"},{en:"helps us",kr:"우리가 ~하도록 돕는다"},{en:"broaden our minds",kr:"우리의 마음을 넓히도록"}], full:"책을 읽는 것은 우리가 마음을 넓히도록 돕는다."},
  {level:"심화", chunks:[{en:"When I arrived",kr:"내가 도착했을 때"},{en:"at the station,",kr:"역에"},{en:"the train",kr:"그 기차는"},{en:"had already left",kr:"이미 떠나 있었다"}], full:"내가 역에 도착했을 때, 그 기차는 이미 떠나 있었다."},
  {level:"심화", chunks:[{en:"The more",kr:"~하면 할수록"},{en:"we learn,",kr:"우리가 배울수록"},{en:"the more",kr:"그만큼 더"},{en:"we realize",kr:"우리는 깨닫는다"},{en:"how little we know",kr:"우리가 얼마나 조금 아는지를"}], full:"배우면 배울수록, 우리는 우리가 얼마나 모르는지를 더 깨닫게 된다."}
];

const canTTS=("speechSynthesis"in window);
function speak(text,btn){if(!canTTS||!text)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=.9;if(btn){btn.classList.add("playing");u.onend=u.onerror=()=>btn.classList.remove("playing");}speechSynthesis.speak(u);}catch(e){}}

/* build token list + model boundary gaps from chunks */
function buildModel(sent){
  let tokens=[],bounds=new Set(),count=0;
  sent.chunks.forEach((c,ci)=>{
    const ws=c.en.split(" ");
    ws.forEach(w=>tokens.push(w));
    count+=ws.length;
    if(ci<sent.chunks.length-1)bounds.add(count-1); // gap after token index (count-1)
  });
  return {tokens,bounds};
}

let pos=0,picks=new Set(),checked=false,scoreSum=0;
render();

function render(){
  checked=false;picks=new Set();
  document.getElementById("prog").textContent=`${pos+1} / ${SENTS.length}`;
  document.getElementById("fill").style.width=(pos/SENTS.length*100)+"%";
  const sent=SENTS[pos],{tokens}=buildModel(sent),view=document.getElementById("view");
  let inner=`<div class="card"><div class="rowtop"><span class="badge">${sent.level} 구문</span>${canTTS?`<button class="spk" id="spk" title="문장 듣기" aria-label="문장 듣기">🔊</button>`:``}</div>
    <div class="instr">의미가 끊어진다고 생각되는 단어 사이를 누르세요.</div>
    <div class="sent" id="sent">`;
  tokens.forEach((t,i)=>{inner+=`<span class="tok">${t}</span>`;if(i<tokens.length-1)inner+=`<span class="gap" data-i="${i}"></span>`;});
  inner+=`</div>
    <div class="controls">
      <button class="btn ghost" id="clear" title="지우기">↺</button>
      <button class="btn solid" id="check">정답 확인</button>
    </div>
    <div class="result" id="result"></div>
    <div class="controls" id="navrow" style="display:none">
      <button class="btn solid" id="next">${pos<SENTS.length-1?"다음 문장 →":"결과 보기 →"}</button>
    </div></div>`;
  view.innerHTML=inner;
  view.querySelectorAll(".gap").forEach(g=>g.onclick=()=>{if(checked)return;const i=+g.dataset.i;
    if(picks.has(i)){picks.delete(i);g.classList.remove("on");}else{picks.add(i);g.classList.add("on");}});
  const spk=document.getElementById("spk");if(spk)spk.onclick=()=>speak(sent.full? sent.chunks.map(c=>c.en).join(" ").replace(/,/g,""):"" ,spk);
  document.getElementById("clear").onclick=()=>{if(checked)return;picks=new Set();view.querySelectorAll(".gap").forEach(g=>g.classList.remove("on"));};
  document.getElementById("check").onclick=check;
  document.getElementById("next").onclick=()=>{if(pos<SENTS.length-1){pos++;render();}else result();};
}

function check(){
  if(checked)return;checked=true;
  const sent=SENTS[pos],{bounds}=buildModel(sent),view=document.getElementById("view");
  let hit=0;
  view.querySelectorAll(".gap").forEach(g=>{
    const i=+g.dataset.i,picked=picks.has(i),model=bounds.has(i);g.classList.remove("on");
    if(picked&&model){g.classList.add("hit");hit++;}
    else if(!picked&&model){g.classList.add("missed");}
    else if(picked&&!model){g.classList.add("overpick");}
  });
  const acc=bounds.size?Math.round(hit/bounds.size*100):100;
  scoreSum+=acc;
  const res=document.getElementById("result");res.classList.add("show");
  res.innerHTML=`<div class="matchline" style="color:${acc>=100?'var(--ok)':acc>=60?'var(--accent)':'var(--miss)'}">
      모범 끊기 ${bounds.size}곳 중 ${hit}곳 일치 · 정확도 ${acc}%</div>
    <div class="chunks">${sent.chunks.map(c=>`<div class="chunk"><span class="en">${c.en}</span><span class="kr">${c.kr}</span></div>`).join("")}</div>
    <div class="full"><span>전체 해석</span>${sent.full}</div>
    <div class="legend"><b class="g">/</b> 잘 끊음 &nbsp; <b class="m">/</b> 놓친 곳 &nbsp; <b class="e">/</b> 불필요하게 끊음</div>`;
  document.getElementById("check").style.display="none";
  document.getElementById("clear").style.display="none";
  document.getElementById("navrow").style.display="flex";
  document.getElementById("fill").style.width=((pos+1)/SENTS.length*100)+"%";
}

function result(){
  const avg=Math.round(scoreSum/SENTS.length);
  const msg=avg>=90?"직독직해 감각이 아주 좋아요! 🏆":avg>=70?"핵심 구문은 잘 잡아요, 계속 연습! 👍":avg>=50?"끊어읽기에 익숙해지는 중이에요 💪":"천천히 의미 단위를 익혀봐요 📖";
  document.getElementById("view").innerHTML=`<div class="panel"><h2>구문 연습 완료</h2>
    <div class="score">${avg}%</div><p>${SENTS.length}문장 평균 정확도</p><p style="margin-top:6px;font-weight:700;color:var(--ink)">${msg}</p>
    <div class="controls" style="margin-top:22px"><button class="btn solid" id="again">처음부터 다시</button></div></div>`;
  document.getElementById("fill").style.width="100%";
  document.getElementById("again").onclick=()=>{pos=0;scoreSum=0;render();};
}
</script>
</body>
</html>
