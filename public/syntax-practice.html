<style>

</style>

 and share", "knowledge."], "full": "학습 조직에서는, 모든 직원이 지식을 습득하고 전달할 책임을 져야 한다."}, {"level": "중급", "chunks": ["Formal training programs, developed in advance and delivered according to a preset schedule ,", "are insufficient", "to address shifting training needs", "and", "encourage timely information sharing ."], "full": "사전에 개발되고 미리 정해진 일정에 따라 전달되는 공식적인 훈련 프로그램은, 변화하는 훈련 요구를 해결하고 시기적절한 정보 공유를 장려하기에 불충분하다."}, {"level": "기초", "chunks": ["Rather,", "human resource development professionals", "must become", "learning facilitators."], "full": "오히려, 인적 자원 개발 전문가들은 학습 촉진자가 되어야 한다."}, {"level": "중급", "chunks": ["Their role", "should be", "to assist, consult, and advise", "teams", "on how best to approach learning ."], "full": "그들의 역할은 팀에게 [학습에 가장 잘 접근하는 방법에] 대해 돕고, 자문하고, 조언하는 것이어야 한다."}, {"level": "심화", "chunks": ["They", "must be able", "to develop", "new mechanisms", "for cross-training peers ― team members ―", "and", "new systems", "for capturing and sharing", "information."], "full": "그들은 동료들, 즉 팀원들을 교차 훈련시키기 위한 새로운 메커니즘과 정보를 포착하고 공유하기 위한 새로운 시스템을 개발할 수 있어야 한다."}, {"level": "중급", "chunks": ["To do this ,", "human resource development professionals", "must be able", "to think systematically", "and", "understand", "how to promote learning within groups and across the organization ."], "full": "이것을 하기 위해, 인적 자원 개발 전문가들은 체계적으로 생각하고 [그룹 내에서 그리고 조직 전체에 걸쳐 학습을 촉진하는 방법을] 이해할 수 있어야 한다."}, {"level": "기초", "chunks": ["It", "is sometimes argued", "that it is shortsighted to get more women into paid employment ."], "full": "때로는 [더 많은 여성을 유급 고용으로 이끄는 것이 근시안적이라고] 주장되기도 한다."}, {"level": "중급", "chunks": ["The more women go out to work ,", "it is said,", "the fewer children there will be", "and", "the lower the growth will be in the long run ."], "full": "[더 많은 여성이 일하러 나갈수록], 아이는 더 적어지고, (장기적으로) 성장은 더 낮아질 것이라고들 말한다."}, {"level": "심화", "chunks": ["However,", "countries", "with high female labor participation rates ,", "such as France and Sweden ,", "tend", "to have", "higher birthrates", "than Germany and Korea, where fewer women work ."], "full": "그러나, (프랑스나 스웨덴과 같이) (여성 노동 참여율이 높은) 국가들은, [여성 고용이 더 적은] 독일이나 한국보다 더 높은 출산율을 갖는 경향이 있다."}, {"level": "중급", "chunks": ["Indeed,", "the decline", "in fertility", "has been", "greatest", "in several countries", "where female employment is low ."], "full": "실제로, 출산율 감소는 여성 고용이 낮은 여러 국가에서 가장 컸다."}, {"level": "중급", "chunks": ["Therefore,", "if higher female labor participation is supported by the right policies ,", "it", "will not reduce", "fertility."], "full": "그러므로, [만약 더 높은 여성의 노동 참여가 올바른 정책에 의해 뒷받침된다면], 그것은 출산율을 감소시키지 않을 것이다."}, {"level": "중급", "chunks": ["To make full use of their national pools of female talent ,", "governments", "need", "to remove", "obstacles", "that make it hard for women to combine work with having children ."], "full": "그들의 국가적 여성 인재 풀을 최대한 활용하기 위해서, 정부는 [여성들이 일과 아이를 갖는 것을 병행하기 어렵게 만드는] 장애물들을 제거할 필요가 있다."}, {"level": "중급", "chunks": ["This", "may mean", "offering parental leave and child care ,", "allowing more flexible working hours ,", "and", "reforming tax and social security systems that hinder women from working ."], "full": "이것은 육아 휴직과 보육을 제공하고, 더 유연한 근무 시간을 허용하며, [여성들이 일하는 것을 방해하는] 세금 및 사회 보장 제도를 개혁하는 것을 의미할 수 있다."}];
const N=12; // 세션당 문장 수
const canTTS=("speechSynthesis"in window);
function speak(text,btn){if(!canTTS||!text)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=.9;if(btn){btn.classList.add("playing");u.onend=u.onerror=()=>btn.classList.remove("playing");}speechSynthesis.speak(u);}catch(e){}}
function buildModel(sent){let tokens=[],bounds=new Set(),count=0;
  sent.chunks.forEach((c,ci)=>{const ws=c.split(" ");ws.forEach(w=>tokens.push(w));count+=ws.length;
    if(ci<sent.chunks.length-1)bounds.add(count-1);});
  return {tokens,bounds};}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

const LEVELS=[
  {k:"기초",d:"짧은 문장 · 2~4 의미 단위"},
  {k:"중급",d:"수식어가 붙은 문장 · 5~7 단위"},
  {k:"심화",d:"수능형 긴 문장 · 8단위 이상"}
];
let session=[],pos=0,picks=new Set(),checked=false,scoreSum=0,curLevel="";
const view=document.getElementById("view");

startScreen();

function startScreen(){
  document.getElementById("prog").textContent="레벨 선택";
  document.getElementById("fill").style.width="0%";
  const counts={};LEVELS.forEach(l=>counts[l.k]=SENTS.filter(s=>s.level===l.k).length);
  view.innerHTML=`<div class="card"><div class="rowtop"><span class="badge">레벨 선택</span></div>
    <div class="instr">레벨을 고르면 그 난이도에서 <b>${N}문장</b>이 무작위로 출제됩니다. (총 ${SENTS.length}문장 은행)</div>
    <div class="levels">${LEVELS.map(l=>`<button class="lvbtn" data-k="${l.k}"><div><div class="lt">${l.k}</div><div class="ld">${l.d}</div></div><span class="cnt">${counts[l.k]}문장</span></button>`).join("")}</div>
  </div>`;
  view.querySelectorAll(".lvbtn").forEach(b=>b.onclick=()=>startSession(b.dataset.k));
}
function startSession(level){
  curLevel=level;
  const pool=SENTS.filter(s=>s.level===level);
  session=shuffle(pool.slice()).slice(0,N);
  pos=0;scoreSum=0;render();
}
function render(){
  checked=false;picks=new Set();
  document.getElementById("prog").textContent=`${pos+1} / ${session.length}`;
  document.getElementById("fill").style.width=(pos/session.length*100)+"%";
  const sent=session[pos],{tokens}=buildModel(sent);
  let inner=`<div class="card"><div class="rowtop"><span class="badge">${sent.level} 구문</span>${canTTS?`<button class="spk" id="spk" title="문장 듣기" aria-label="문장 듣기">🔊</button>`:``}</div>
    <div class="instr">의미가 끊어진다고 생각되는 단어 사이를 누르세요.</div>
    <div class="sent" id="sent">`;
  tokens.forEach((t,i)=>{inner+=`<span class="tok">${t}</span>`;if(i<tokens.length-1)inner+=`<span class="gap" data-i="${i}"></span>`;});
  inner+=`</div>
    <div class="controls">
      <button class="btn ghost" id="clear" title="지우기">↺</button>
      <button class="btn solid" id="check">정답 확인</button>
    </div>
    <div class="result" id="result"></div>
    <div class="controls" id="navrow" style="display:none">
      <button class="btn solid" id="next">${pos<session.length-1?"다음 문장 →":"결과 보기 →"}</button>
    </div></div>`;
  view.innerHTML=inner;
  view.querySelectorAll(".gap").forEach(g=>g.onclick=()=>{if(checked)return;const i=+g.dataset.i;
    if(picks.has(i)){picks.delete(i);g.classList.remove("on");}else{picks.add(i);g.classList.add("on");}});
  const spk=document.getElementById("spk");if(spk)spk.onclick=()=>speak(sent.chunks.join(" "),spk);
  document.getElementById("clear").onclick=()=>{if(checked)return;picks=new Set();view.querySelectorAll(".gap").forEach(g=>g.classList.remove("on"));};
  document.getElementById("check").onclick=check;
  document.getElementById("next").onclick=()=>{if(pos<session.length-1){pos++;render();}else result();};
}
function check(){
  if(checked)return;checked=true;
  const sent=session[pos],{bounds}=buildModel(sent);
  let hit=0;
  view.querySelectorAll(".gap").forEach(g=>{
    const i=+g.dataset.i,picked=picks.has(i),model=bounds.has(i);g.classList.remove("on");
    if(picked&&model){g.classList.add("hit");hit++;}
    else if(!picked&&model){g.classList.add("missed");}
    else if(picked&&!model){g.classList.add("overpick");}
  });
  const acc=bounds.size?Math.round(hit/bounds.size*100):100;
  scoreSum+=acc;
  const res=document.getElementById("result");res.classList.add("show");
  res.innerHTML=`<div class="matchline" style="color:${acc>=100?'var(--ok)':acc>=60?'var(--accent)':'var(--miss)'}">
      모범 끊기 ${bounds.size}곳 중 ${hit}곳 일치 · 정확도 ${acc}%</div>
    <div class="chunks">${sent.chunks.map(c=>`<span class="chunk">${c}</span>`).join("")}</div>
    <div class="full"><span>우리말 해석</span>${sent.full}</div>
    <div class="legend"><b class="g">/</b> 잘 끊음 &nbsp; <b class="m">/</b> 놓친 곳 &nbsp; <b class="e">/</b> 불필요하게 끊음</div>`;
  document.getElementById("check").style.display="none";
  document.getElementById("clear").style.display="none";
  document.getElementById("navrow").style.display="flex";
  document.getElementById("fill").style.width=((pos+1)/session.length*100)+"%";
}
function result(){
  const avg=Math.round(scoreSum/session.length);
  const msg=avg>=90?"직독직해 감각이 아주 좋아요! 🏆":avg>=70?"핵심 구문은 잘 잡아요, 계속 연습! 👍":avg>=50?"끊어읽기에 익숙해지는 중이에요 💪":"천천히 의미 단위를 익혀봐요 📖";
  view.innerHTML=`<div class="panel"><h2>구문 연습 완료</h2>
    <div class="score">${avg}%</div><p>${curLevel} · ${session.length}문장 평균 정확도</p><p style="margin-top:6px;font-weight:700;color:var(--ink)">${msg}</p>
    <div class="controls" style="margin-top:22px">
      <button class="btn solid" id="again">${curLevel} 새 문장</button>
      <button class="btn" id="relevel">레벨 바꾸기</button>
    </div></div>`;
  document.getElementById("fill").style.width="100%";
  document.getElementById("again").onclick=()=>startSession(curLevel);
  document.getElementById("relevel").onclick=startScreen;
}
</script>
</body>
